# 手元のフック（lefthook）と同じ確かめと、E2E テストと Lighthouse をかける。
# main には直接 push しているので、push でも回す（プルリクエストだけだと一度も走らない）。
# 依存の更新（Renovate）の PR は手元を通らないので、ここが唯一の確かめ
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vocafy
          POSTGRES_PASSWORD: vocafy
          POSTGRES_DB: vocafy
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vocafy" --health-interval 2s --health-retries 30
    env:
      # 小さな台帳（db/fixture.sql）を入れた CI 用の DB。ビルドがトップとボカロPの一覧を作るのに要る
      DATABASE_URL: postgres://vocafy:vocafy@localhost:5434/vocafy
    steps:
      - uses: actions/checkout@v7
        with:
          # 下のマイグレーションの確かめで、push の前のコミットと比べる
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # 手元のフック（.squawk.toml と .lefthook/pre-commit/migrations.sh）と同じ確かめ。フックを通らなかったコミット
      # （--no-verify）も、ここで止める。比べる元は、プルリクエストなら元のブランチ、push なら push の前の先頭
      - name: マイグレーション（書き換え・消すのを止め、足したものに squawk）
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "比べる元のコミットが無いので飛ばす"
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- 'db/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::コミット済みのマイグレーションを書き換えるか消しています。直すなら新しい番号のファイルを足す"
            echo "$changed"
            exit 1
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'db/migrations/*.sql')
          if [ -n "$added" ]; then
            echo "$added" | xargs pnpm exec squawk
          fi

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm secretlint

      - run: pnpm test

      # DB を読むテスト。同じ Postgres の中にテスト用の DB（vocafy_test）を作って使う（test/db/）
      - run: pnpm test:db

      # 使われていないファイル・エクスポート・パッケージ
      - run: pnpm knip

      - run: pnpm migrate

      - run: psql "$DATABASE_URL" -f db/fixture.sql

      # トップとボカロPの一覧はビルドのときに DB から作る
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vocafy
          POSTGRES_PASSWORD: vocafy
          POSTGRES_DB: vocafy
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vocafy" --health-interval 2s --health-retries 30
    env:
      # 小さな台帳（db/fixture.sql）を入れた CI 用の DB。ビルドがトップとボカロPの一覧を作るのに要る
      DATABASE_URL: postgres://vocafy:vocafy@localhost:5434/vocafy
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # ブラウザは Playwright の版ごとに残す。残っていれば、OS の部品だけ入れる
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm migrate

      - run: psql "$DATABASE_URL" -f db/fixture.sql

      # 本番のビルドを立ち上げて、パソコンとスマホの幅で確かめる（playwright.config.ts）
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # 速い確かめを待たせないよう別の仕事にする（kk-web と同じ形）。閾値は lighthouserc.js。
  # performance だけ warn なので、数字の揺れでは落ちない。落ちるのは
  # アクセシビリティ・best practices・SEO が 0.9 を割ったときだけ
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vocafy
          POSTGRES_PASSWORD: vocafy
          POSTGRES_DB: vocafy
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vocafy" --health-interval 2s --health-retries 30
    env:
      # 小さな台帳（db/fixture.sql）を入れた CI 用の DB。測るボカロPの画面（/producers/45）は DECO＊27
      DATABASE_URL: postgres://vocafy:vocafy@localhost:5434/vocafy
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm migrate

      - run: psql "$DATABASE_URL" -f db/fixture.sql

      - run: pnpm lighthouse

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          # .lighthouseci は隠しディレクトリ。これを立てないと既定で除かれ、中身が上がらないまま仕事は緑になる
          include-hidden-files: true
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
