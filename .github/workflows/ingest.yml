# 本番の DB に、この 30 日に出た曲のうち取り込み済みのボカロPの曲を足し、配備し直す。週に1回（月曜の午前4時、日本時間）と、手で走らせたとき。
# 配備し直さないと、作り置きのページに新しい曲が出ない（CLAUDE.md の「本番の DB への取り込み」）。
#
# VocaDB に聞くのは、30 日分の曲の一覧（1週間でおよそ 370 曲、50 曲ずつで 30 ページほど）と、表に無い歌声だけ。
# 1 秒に 1 回までなので1分ほどで済む。控えは持ち越さない。日付で聞くので毎回取り直しになるが、量が小さいため。
# 30 日にしているのは、VocaDB への登録が投稿より遅れることがあるから。
# 新しいボカロPや種の入れ替えは、手元で全体の取り込み（pnpm ingest --seeds 1600）を走らせる。こちらは VocaDB に数千回聞くので、
# 走らせる前に回数を見積もる
#
# 鍵（リポジトリの secrets）:
#   PROD_DATABASE_URL   本番の DB（Vercel の DATABASE_URL_UNPOOLED。プールを通さない接続）
#   VERCEL_DEPLOY_HOOK  Vercel の vocafy の Deploy Hook「ingest」（main を配備し直す）
name: ingest

on:
  schedule:
    # UTC の日曜 19 時 = 日本時間の月曜 4 時
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # VocaDB が止まっているときは、聞き直しで最大 15 分ほど待つ（scripts/lib/vocadb.ts）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsx scripts/ingest.ts --recent 30
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
