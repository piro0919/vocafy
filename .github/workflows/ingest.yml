# 本番の DB に、この 30 日に出た曲のうち取り込み済みのボカロPの曲を足し、新しく種に掛かったボカロPの全曲を入れて、配備し直す。
# 週に1回（月曜の午前4時、日本時間）と、手で走らせたとき。
# 配備し直さないと、作り置きのページに新しい曲が出ない（CLAUDE.md の「本番の DB への取り込み」）。
#
# 新しいボカロPは、ニコニコの伝説入りと YouTube で100万回以上の線を全体の取り込みと同じにして、この1年に出た曲だけを見る。
# 評価点の上位は見ない（scripts/ingest.ts の seedSongs）。新しい人が 20 人を超えたら書かずに止める（scripts/ingest.ts）。
#
# VocaDB に聞くのは、30 日分の曲の一覧（15 ページほど）、この1年の YouTube の候補（25 ページほど）、
# この1年の伝説入りの引き当て（数本）、新しいボカロPの全曲と項目、表に無い歌声。1 秒に 1 回までなので数分で済む。
# YouTube Data API は 50 単位ほど（無料枠は1日 10,000 単位）。控えは持ち越さないので、毎回取り直す。
# 30 日にしているのは、VocaDB への登録が投稿より遅れることがあるから。
# 種の入れ替えや、1年より前の曲で線を越えた人は、手元で全体の取り込み（pnpm ingest --seeds 1600）を走らせる。
# こちらは VocaDB に数千回聞くので、走らせる前に回数を見積もる
#
# 鍵（リポジトリの secrets）:
#   PROD_DATABASE_URL   本番の DB（Vercel の DATABASE_URL_UNPOOLED。プールを通さない接続）
#   YOUTUBE_API_KEY     YouTube Data API の鍵（再生数の線）
#   VERCEL_DEPLOY_HOOK  Vercel の vocafy の Deploy Hook「ingest」（main を配備し直す）
name: ingest

on:
  schedule:
    # UTC の日曜 19 時 = 日本時間の月曜 4 時
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # VocaDB が止まっているときは、聞き直しで最大 15 分ほど待つ（scripts/lib/vocadb.ts）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsx scripts/ingest.ts --recent 30
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
